# PR pipeline: validate only. No image build, no deploy.
# Reports back to the GitHub PR as a status check.
steps:
  - id: install
    name: node:22-alpine
    entrypoint: npm
    args: ['ci']

  - id: lint
    name: node:22-alpine
    entrypoint: npm
    args: ['run', 'lint']

  - id: test
    name: node:22-alpine
    entrypoint: npm
    args: ['test']

# Required when a build runs as a user-specified service account.
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

timeout: 600s
